<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الرمادي لايز | المتجر الإلكتروني</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body { background-color: #f4f7f6; color: #333; line-height: 1.6; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }
    
    /* تصميم الغلاف الجديد */
    .cover-container { text-align: center; margin-bottom: 20px; }
    .cover-img { width: 100%; height: 300px; object-fit: cover; border-radius: 0 0 15px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .store-title { font-size: 2.5rem; color: #2c3e50; margin-top: 15px; }
    
    /* شريط التنقل */
    .navbar { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 30px; gap: 10px;}
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn-primary { background: #2c3e50; color: #fff; }
    .btn-primary:hover { background: #1a252f; }
    .btn-outline { background: transparent; border: 1px solid #2c3e50; color: #2c3e50; }
    
    /* الفورمة (التسجيل والدخول) */
    .auth-box { background: #fff; padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto 40px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); display: none; }
    .auth-box.active { display: block; }
    .input-field { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
    
    /* المنتجات */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .product-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
    .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
    
    /* لوحة التحكم */
    .admin-panel { background: #e8f4f8; padding: 20px; border-radius: 10px; margin-bottom: 40px; border: 2px solid #bce0ed; display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- الغلاف: صورة عادية مثل ما طلبت -->
  <div class="container cover-container">
    <img src="al-ramadi-lays-cover.jpg" alt="غلاف متجر الرمادي" class="cover-img" onerror="this.style.display='none';">
    <h1 class="store-title">الرمادي لايز</h1>
    <p>متجرك الفخم لكل ما تحتاجه</p>
  </div>

  <div class="container">
    <!-- شريط التنقل -->
    <div class="navbar">
      <div>
        <strong id="welcomeText" style="color: #2c3e50;"></strong>
      </div>
      <div>
        <button class="btn btn-outline" id="btnShowLogin">تسجيل الدخول</button>
        <button class="btn btn-primary" id="btnShowRegister">حساب جديد</button>
        <button class="btn btn-outline hidden" id="btnLogout">تسجيل الخروج</button>
      </div>
    </div>

    <!-- واجهة الدخول / التسجيل -->
    <div class="auth-box" id="authBox">
      <h2 id="authTitle" style="text-align: center; margin-bottom: 20px;">تسجيل الدخول</h2>
      <input type="email" id="emailInput" class="input-field" placeholder="البريد الإلكتروني (مثال: ali@gmail.com)">
      <input type="password" id="passwordInput" class="input-field" placeholder="الرمز السري (6 أحرف أو أرقام على الأقل)">
      <button class="btn btn-primary" id="btnSubmitAuth" style="width: 100%;">دخول</button>
    </div>

    <!-- لوحة تحكم الأدمن -->
    <div class="admin-panel" id="adminPanel">
      <h3>لوحة تحكم الأدمن (إضافة المنتجات)</h3>
      <br>
      <input type="text" id="prodName" class="input-field" placeholder="اسم المنتج">
      <input type="text" id="prodPrice" class="input-field" placeholder="السعر">
      <input type="text" id="prodDesc" class="input-field" placeholder="الوصف">
      <input type="text" id="prodImg" class="input-field" placeholder="رابط صورة المنتج (اختياري)">
      <button class="btn btn-primary" id="btnAddProduct">نشر المنتج</button>
    </div>

    <!-- عرض المنتجات -->
    <h2 style="margin-bottom: 20px;">المنتجات</h2>
    <div class="products-grid" id="productsGrid">
      <p>جاري تحميل المنتجات...</p>
    </div>
  </div>

  <script>
    // ربط قاعدة البيانات
    const SUPABASE_URL = 'https://ydfdtlrcvkvgmigkaskz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BqBQSvJBxYzpbM3qod0idA_5tR248ci';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // متغيرات
    let currentMode = 'login';
    const ADMIN_EMAIL = '3tx@ramadi.com'; // إيميل الأدمن

    // عناصر HTML
    const authBox = document.getElementById('authBox');
    const authTitle = document.getElementById('authTitle');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const btnSubmitAuth = document.getElementById('btnSubmitAuth');
    const welcomeText = document.getElementById('welcomeText');
    const btnShowLogin = document.getElementById('btnShowLogin');
    const btnShowRegister = document.getElementById('btnShowRegister');
    const btnLogout = document.getElementById('btnLogout');
    const adminPanel = document.getElementById('adminPanel');
    const productsGrid = document.getElementById('productsGrid');

    // إظهار واجهة تسجيل الدخول
    btnShowLogin.onclick = () => {
      currentMode = 'login';
      authTitle.innerText = 'تسجيل الدخول';
      btnSubmitAuth.innerText = 'دخول';
      authBox.classList.add('active');
    };

    // إظهار واجهة حساب جديد
    btnShowRegister.onclick = () => {
      currentMode = 'register';
      authTitle.innerText = 'إنشاء حساب جديد';
      btnSubmitAuth.innerText = 'تسجيل الحساب';
      authBox.classList.add('active');
    };

    // عملية الدخول أو التسجيل
    btnSubmitAuth.onclick = async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        alert('رجاءً اكتب الإيميل والرمز السري!');
        return;
      }

      btnSubmitAuth.innerText = 'جاري التحميل...';

      try {
        if (currentMode === 'login') {
          // تسجيل دخول
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          alert('تم تسجيل الدخول بنجاح!');
          checkUser(data.user);
        } else {
          // حساب جديد
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) throw error;
          alert('تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.');
          checkUser(data.user);
        }
        emailInput.value = '';
        passwordInput.value = '';
      } catch (error) {
        alert('حدث خطأ: ' + error.message);
      }

      btnSubmitAuth.innerText = currentMode === 'login' ? 'دخول' : 'تسجيل الحساب';
    };

    // تسجيل الخروج
    btnLogout.onclick = async () => {
      await supabase.auth.signOut();
      checkUser(null);
      alert('تم تسجيل الخروج.');
    };

    // التحقق من حالة المستخدم
    function checkUser(user) {
      if (user) {
        authBox.classList.remove('active');
        btnShowLogin.classList.add('hidden');
        btnShowRegister.classList.add('hidden');
        btnLogout.classList.remove('hidden');
        
        if (user.email === ADMIN_EMAIL) {
          welcomeText.innerText = 'مرحباً، أنت داخل بحساب الأدمن';
          adminPanel.style.display = 'block';
        } else {
          welcomeText.innerText = 'مرحباً بك في المتجر';
          adminPanel.style.display = 'none';
        }
      } else {
        welcomeText.innerText = '';
        btnShowLogin.classList.remove('hidden');
        btnShowRegister.classList.remove('hidden');
        btnLogout.classList.add('hidden');
        adminPanel.style.display = 'none';
      }
    }

    // جلب المنتجات من القاعدة
    async function loadProducts() {
      try {
        const { data, error } = await supabase.from('products').select('*');
        if (error) throw error;
        
        productsGrid.innerHTML = '';
        if (data.length === 0) {
          productsGrid.innerHTML = '<p>لا توجد منتجات حالياً.</p>';
          return;
        }

        data.forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = `
            <img src="${p.image_url || 'https://via.placeholder.com/250'}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p style="color: #777;">${p.description || ''}</p>
            <h4 style="color: #2c3e50; margin-top: 10px;">${p.price}</h4>
          `;
          productsGrid.appendChild(card);
        });
      } catch (error) {
        productsGrid.innerHTML = `<p style="color: red;">خطأ في تحميل المنتجات: ${error.message}</p>`;
      }
    }

    // إضافة منتج جديد (للأدمن)
    document.getElementById('btnAddProduct').onclick = async () => {
      const name = document.getElementById('prodName').value;
      const price = document.getElementById('prodPrice').value;
      const description = document.getElementById('prodDesc').value;
      const image_url = document.getElementById('prodImg').value;

      if (!name || !price) {
        alert('رجاءً اكتب اسم المنتج والسعر!');
        return;
      }

      try {
        const { error } = await supabase.from('products').insert([{ name, price, description, image_url }]);
        if (error) throw error;
        
        alert('تم إضافة المنتج بنجاح!');
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodImg').value = '';
        loadProducts();
      } catch (error) {
        alert('خطأ في الإضافة: ' + error.message);
      }
    };

    // التشغيل الأولي
    async function init() {
      const { data } = await supabase.auth.getSession();
      checkUser(data.session ? data.session.user : null);
      loadProducts();
    }

    init();
  </script>
</body>
</html>
